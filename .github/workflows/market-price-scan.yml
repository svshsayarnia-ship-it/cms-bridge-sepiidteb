# Scanner trigger: multi-source-v5
name: Market price scan

on:
  schedule:
    - cron: "30 5,11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-price-scan.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: market-price-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan every Sepiid Beauty product in batches
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://sepiidbeauty.ir/api/cron/market-prices/github"
          LIMIT=10
          RUN_STARTED_AT="$(python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z'))
          PY
          )"

          issue_token() {
            local response
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sepiid-price-cron")"
            printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          request_endpoint() {
            local target="$1"
            local token status
            token="$(issue_token)"
            status="$(curl --silent --show-error \
              --max-time 240 \
              --output /tmp/sepiid-price-response.txt \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              --header "Content-Type: application/json" \
              "$target" || true)"
            printf '%s' "$status"
          }

          echo "Waiting for multi-source v5 scanner deployment..."
          READY=0
          for attempt in $(seq 1 36); do
            STATUS="$(request_endpoint "${BASE}?health=1")"
            if [[ "$STATUS" =~ ^2 ]] && grep -q '"scanMode":"batched-market-v5-direct-fallback"' /tmp/sepiid-price-response.txt; then
              READY=1
              break
            fi
            echo "Health attempt ${attempt}: HTTP ${STATUS}"
            cat /tmp/sepiid-price-response.txt || true
            echo
            sleep 10
          done

          if [ "$READY" -ne 1 ]; then
            echo "Multi-source v5 market scanner did not become ready."
            exit 1
          fi

          CURSOR=0
          COMPLETED=0
          TOTAL=0
          PROCESSED=0
          MATCHED=0
          UNRESOLVED=0
          FAILED=0

          for batch in $(seq 1 30); do
            TARGET="${BASE}?cursor=${CURSOR}&limit=${LIMIT}"
            BATCH_OK=0

            for attempt in 1 2 3; do
              STATUS="$(request_endpoint "$TARGET")"
              if [[ "$STATUS" =~ ^2 ]]; then
                BATCH_OK=1
                break
              fi
              echo "Batch ${batch}, attempt ${attempt}: HTTP ${STATUS}"
              cat /tmp/sepiid-price-response.txt || true
              echo
              sleep 8
            done

            if [ "$BATCH_OK" -ne 1 ]; then
              echo "Batch ${batch} failed after retries."
              exit 1
            fi

            echo "Batch ${batch} response:"
            cat /tmp/sepiid-price-response.txt
            echo

            read -r BATCH_TOTAL BATCH_PROCESSED BATCH_MATCHED BATCH_UNRESOLVED BATCH_FAILED NEXT_CURSOR <<EOF
          $(python3 - <<'PY'
          import json
          with open('/tmp/sepiid-price-response.txt', encoding='utf-8') as f:
              s = json.load(f)['summary']
          nxt = s['nextCursor']
          print(s['totalProducts'], s['processedProducts'], s['matchedProducts'], s['unresolvedProducts'], s['failedProducts'], '' if nxt is None else nxt)
          PY
          )
          EOF

            TOTAL="$BATCH_TOTAL"
            PROCESSED=$((PROCESSED + BATCH_PROCESSED))
            MATCHED=$((MATCHED + BATCH_MATCHED))
            UNRESOLVED=$((UNRESOLVED + BATCH_UNRESOLVED))
            FAILED=$((FAILED + BATCH_FAILED))

            if [ -z "$NEXT_CURSOR" ]; then
              COMPLETED=1
              break
            fi
            CURSOR="$NEXT_CURSOR"
          done

          if [ "$COMPLETED" -ne 1 ]; then
            echo "Product scan did not reach the final batch."
            exit 1
          fi

          COVERAGE_PERCENT="$(python3 - "$MATCHED" "$TOTAL" <<'PY'
          import sys
          matched, total = map(int, sys.argv[1:3])
          print(f'{(matched / total * 100) if total else 0:.1f}')
          PY
          )"
          echo "Market coverage: ${MATCHED}/${TOTAL} = ${COVERAGE_PERCENT}% | processed=${PROCESSED} unresolved=${UNRESOLVED} failed=${FAILED}"
          echo "::notice title=Market price coverage::${MATCHED}/${TOTAL} products (${COVERAGE_PERCENT}%) matched; unresolved=${UNRESOLVED}; failed=${FAILED}"

          ENCODED_STARTED_AT="$(python3 - "$RUN_STARTED_AT" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
          STATUS="$(request_endpoint "${BASE}?finalize=1&startedAt=${ENCODED_STARTED_AT}")"
          if [[ ! "$STATUS" =~ ^2 ]]; then
            echo "Finalize failed: HTTP ${STATUS}"
            cat /tmp/sepiid-price-response.txt || true
            exit 1
          fi

          echo "Finalize response:"
          cat /tmp/sepiid-price-response.txt
          echo

          if [ "$FAILED" -gt 0 ]; then
            echo "Full scan completed but ${FAILED} products failed technically."
            exit 1
          fi
