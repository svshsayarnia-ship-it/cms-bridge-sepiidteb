name: Repair Telegram market scan continuation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-price-scan.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch Telegram scan and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/telegram/market-prices/route.ts')
          text = p.read_text(encoding='utf-8')
          if 'const FULL_SCAN_BATCH_SIZE = 4;' not in text:
              raise SystemExit('batch-size marker not found')
          text = text.replace('const FULL_SCAN_BATCH_SIZE = 4;', 'const FULL_SCAN_BATCH_SIZE = 10;', 1)
          start = text.index('    if (summary.nextCursor !== null) {\n      const response = await fetch(telegramEndpoint(), {')
          end_marker = '      return;\n    }\n\n    const alerts = await listNewMarketPricingProposalAlerts(state.startedAt);'
          end = text.index(end_marker, start)
          replacement = '''    if (summary.nextCursor !== null) {
      // Continue in the same background invocation. Recursive HTTP calls to
      // this Vercel deployment are loop-protected and return HTTP 508.
      await continueMarketScan(next, config);
      return;
    }

    const alerts = await listNewMarketPricingProposalAlerts(state.startedAt);'''
          text = text[:start] + replacement + text[end + len(end_marker):]
          p.write_text(text, encoding='utf-8')
          PY

          git show HEAD^:.github/workflows/market-price-scan.yml > .github/workflows/market-price-scan.yml
          if [ -f .github/workflows/fix-telegram-market-scan-508.yml ]; then
            git rm .github/workflows/fix-telegram-market-scan-508.yml
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/telegram/market-prices/route.ts .github/workflows/market-price-scan.yml
          git commit -m "Telegram: remove 508 market scan self-call"
          git push
