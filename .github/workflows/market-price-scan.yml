name: Market price scan

on:
  schedule:
    - cron: "30 5,11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-price-scan.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: market-price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sepiid-price-cron")"
          TOKEN="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Sepiid Beauty market scan
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          TARGET="https://sepiidbeauty.ir/api/cron/market-prices/github"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TARGET="${TARGET}?health=1"
          fi

          for attempt in $(seq 1 18); do
            STATUS="$(curl --silent --show-error \
              --output /tmp/sepiid-price-response.txt \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${OIDC_TOKEN}" \
              --header "Content-Type: application/json" \
              "$TARGET" || true)"

            if [[ "$STATUS" =~ ^2 ]]; then
              cat /tmp/sepiid-price-response.txt
              echo
              exit 0
            fi

            echo "Attempt ${attempt}: HTTP ${STATUS}"
            cat /tmp/sepiid-price-response.txt || true
            echo
            sleep 10
          done

          echo "GitHub OIDC call did not become ready in time."
          exit 1
