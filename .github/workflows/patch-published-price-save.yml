name: Patch published product price save

on:
  push:
    branches:
      - fix/published-price-save-20260813

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/published-price-save-20260813
          fetch-depth: 0

      - name: Patch publish readiness guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/cms/CmsDashboard.tsx')
          text = path.read_text()
          old = '''if (\n  selected.status === "publish" &&\n  !isPublishReady\n) {'''
          new = '''const persistedProduct =\n  selected.id > 0\n    ? products.find((product) => product.id === selected.id) ?? null\n    : null;\nconst isPublishingForFirstTime =\n  selected.status === "publish" &&\n  (selected.id === 0 || persistedProduct?.status !== "publish");\n\nif (\n  isPublishingForFirstTime &&\n  !isPublishReady\n) {'''
          if old not in text:
              raise SystemExit('Expected publish readiness guard was not found; refusing to patch.')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Remove one-off workflow
        run: rm .github/workflows/patch-published-price-save.yml

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/cms/CmsDashboard.tsx .github/workflows/patch-published-price-save.yml
          git commit -m "fix: allow price edits on published products"
          git push origin HEAD:fix/published-price-save-20260813
