name: Variant Pricing Build Verification

on:
  push:
    branches:
      - fix/cms-variant-price-editor

permissions:
  contents: read

concurrency:
  group: variant-pricing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
