name: Apply price and image consistency fix

on:
  push:
    branches:
      - fix/price-image-consistency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure verified image helper import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/storefront-catalog.ts')
          text = path.read_text()
          old = '''import {\n  isPublicCmsProduct,\n  isPublicStaticProduct,\n} from "./public-product";'''
          new = '''import {\n  isPublicCmsProduct,\n  isPublicImageSrc,\n  isPublicStaticProduct,\n} from "./public-product";'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate lint and TypeScript
        run: |
          npm ci
          npm run lint --if-present
          npx tsc --noEmit
      - name: Commit import fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/storefront-catalog.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: import public image validation helper'
          git push
