name: Validate uncovered market sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-uncovered-market-sources.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search fallback WooCommerce stores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request

          targets = {
            'ejal-40': ['ejal 40', 'ایجال 40'],
            'mesoheal-plus': ['mesoheal plus', 'مزوهیل پلاس'],
            'reyoungel-revital-bioha': ['reyoungel revital', 'ریانژل رویتال'],
            'roytrin-skin-booster': ['roytrin skin booster', 'رویترین اسکین بوستر'],
            'siax-100': ['siax 100', 'سیاکس 100'],
            'neuronox-100': ['neuronox 100', 'نورونوکس 100'],
            'cg-dimono-ptx': ['cg dimono ptx', 'دیمونو ptx'],
            'perleux': ['perleux', 'پرلوکس'],
            'audrey-m': ['audrey m', 'اودری ام'],
            'inovosense-family': ['inovosense', 'اینووسنس'],
            'neuronox-50': ['neuronox 50', 'نورونوکس 50'],
            'dysport': ['dysport', 'دیسپورت'],
          }
          providers = {
            'sayancenter': 'https://sayancenter.com',
            'rokateb': 'https://rokateb.ir',
            'noavaransalamat': 'https://noavaransalamat.ir',
          }
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}

          def norm(s):
            s=(s or '').lower().replace('ي','ی').replace('ك','ک')
            s=re.sub(r'[^\w\u0600-\u06ff.]+',' ',s)
            return re.sub(r'\s+',' ',s).strip()

          def score(q,name):
            a=[x for x in norm(q).split() if len(x)>1]
            b=set(norm(name).split())
            if not a or not b: return 0
            return sum(1 for x in a if x in b)/len(a)

          found={}
          for slug, queries in targets.items():
            best=[]
            for provider,base in providers.items():
              for q in queries:
                url=base+'/wp-json/wc/store/v1/products?'+urllib.parse.urlencode({'search':q,'per_page':20})
                req=urllib.request.Request(url,headers=headers)
                try:
                  with urllib.request.urlopen(req,timeout=15) as r: rows=json.load(r)
                except Exception as e:
                  print('ERROR',slug,provider,q,repr(e)); continue
                if not isinstance(rows,list): continue
                for row in rows:
                  name=row.get('name') or ''
                  sc=score(q,name)
                  prices=row.get('prices') or {}
                  raw=prices.get('price')
                  currency=(prices.get('currency_code') or 'IRT').upper()
                  minor=int(prices.get('currency_minor_unit') or 0)
                  try: p=float(raw)/(10**minor)
                  except: p=0
                  if currency=='IRR': p/=10
                  if sc>=0.5 and row.get('is_in_stock') is not False and row.get('is_purchasable') is not False and p>=100000:
                    best.append((sc,provider,name,round(p),row.get('permalink') or ''))
            best.sort(reverse=True,key=lambda x:x[0])
            if best:
              found[slug]=best[:5]
              print('FOUND',slug,json.dumps(best[:5],ensure_ascii=False))
            else:
              print('NONE',slug)
          print('SUMMARY',json.dumps({'targets':len(targets),'matched':len(found),'unmatched':[k for k in targets if k not in found]},ensure_ascii=False))
          PY

          rm .github/workflows/validate-uncovered-market-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-uncovered-market-sources.yml
          git commit -m "chore: remove fallback market validation"
          git push
