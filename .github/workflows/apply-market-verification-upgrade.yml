name: Apply verified market upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-market-verification-upgrade.yml"
      - "scripts/apply-market-verification-upgrade.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verification upgrade
        run: python3 scripts/apply-market-verification-upgrade.py
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing-comprehensive.ts app/lib/market-pricing.ts app/cms/PricingManager.tsx app/lib/market-price-alerts.ts app/cms/cms.css
          git commit -m "Pricing: verify market prices against suspicious listings"
          git push
