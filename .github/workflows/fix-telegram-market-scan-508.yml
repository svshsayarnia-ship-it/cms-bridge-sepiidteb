name: Fix Telegram market scan 508

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-telegram-market-scan-508.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove recursive HTTP continuation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/telegram/market-prices/route.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const FULL_SCAN_BATCH_SIZE = 4;', 'const FULL_SCAN_BATCH_SIZE = 10;')
          old = '''    if (summary.nextCursor !== null) {
      const response = await fetch(telegramEndpoint(), {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-sepiid-market-scan-token": internalScanToken(config.telegramBotToken),
          ...(process.env.MARKET_PRICE_TELEGRAM_WEBHOOK_SECRET
            ? {
                "x-telegram-bot-api-secret-token":
                  process.env.MARKET_PRICE_TELEGRAM_WEBHOOK_SECRET,
              }
            : {}),
        },
        body: JSON.stringify({ sepiid_market_scan: next }),
        cache: "no-store",
      });
      if (!response.ok) throw new Error(`Market scan continuation returned ${response.status}`);
      return;
    }
'''
          new = '''    if (summary.nextCursor !== null) {
      // Continue locally inside the same background invocation. Calling the
      // public Telegram webhook recursively is treated as a loop by Vercel
      // and returns HTTP 508 after the first batch.
      await continueMarketScan(next, config);
      return;
    }
'''
          if old not in text:
              raise SystemExit('expected continuation block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-telegram-market-scan-508.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/telegram/market-prices/route.ts .github/workflows/fix-telegram-market-scan-508.yml
          git commit -m "Telegram: fix full market scan 508 continuation"
          git push
