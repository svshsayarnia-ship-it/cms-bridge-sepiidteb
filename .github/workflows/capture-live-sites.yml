name: Temporary live site capture

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-live-sites.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser tooling
        run: |
          mkdir -p /tmp/site-capture
          cd /tmp/site-capture
          npm init -y
          npm install playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Capture live production homepages
        working-directory: /tmp/site-capture
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const targets = [
            {
              name: 'khottan',
              title: /ختن|Khottan/i,
              urls: [
                'https://www.khottan.ir/',
                'https://khottan-platform-7wbv5cac6-svshsayarnia-ship-its-projects.vercel.app/'
              ]
            },
            {
              name: 'sepiid-beauty',
              title: /سپید|Sepiid/i,
              urls: [
                'https://sepiidbeauty.ir/',
                'https://www.sepiidbeauty.ir/',
                'https://cms-bridge-sepiidteb-pgpy55ch9-svshsayarnia-ship-its-projects.vercel.app/'
              ]
            },
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1600, height: 960 },
            deviceScaleFactor: 1,
            locale: 'fa-IR',
            colorScheme: 'light',
            reducedMotion: 'reduce',
          });

          for (const target of targets) {
            const page = await context.newPage();
            page.setDefaultTimeout(30000);
            let loaded = false;
            let lastError = null;

            for (const url of target.urls) {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(6000);
                const title = await page.title();
                if (!target.title.test(title)) {
                  throw new Error(`Unexpected title: ${title}`);
                }
                console.log(`${target.name}: ${title} -> ${page.url()}`);
                loaded = true;
                break;
              } catch (error) {
                lastError = error;
                console.log(`Fallback after ${url}: ${error.message}`);
              }
            }

            if (!loaded) {
              throw lastError || new Error(`Could not load ${target.name}`);
            }

            await page.evaluate(() => {
              window.scrollTo(0, 0);
              const style = document.createElement('style');
              style.textContent = '*{animation:none!important;transition:none!important;caret-color:transparent!important}';
              document.head.appendChild(style);
            });
            await page.waitForTimeout(800);

            const rawPath = `${target.name}-raw.png`;
            const outPath = `${target.name}-800x480.png`;
            await page.screenshot({ path: rawPath, fullPage: false });
            await sharp(rawPath)
              .resize(800, 480, { fit: 'fill' })
              .png({ compressionLevel: 9 })
              .toFile(outPath);
            await page.close();
          }

          await browser.close();
          EOF
          node capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-site-screenshots-800x480
          path: |
            /tmp/site-capture/khottan-800x480.png
            /tmp/site-capture/sepiid-beauty-800x480.png
          if-no-files-found: error
          retention-days: 1
