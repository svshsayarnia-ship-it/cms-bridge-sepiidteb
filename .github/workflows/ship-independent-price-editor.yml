name: Ship independent price editor

on:
  push:
    branches:
      - fix/ship-independent-price-editor-20260813

permissions:
  contents: write

jobs:
  port-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ship-independent-price-editor-20260813
          fetch-depth: 0

      - name: Port independent price API and editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick e92d9e26c1dff7281250502c4129bfe9cd0297ab
          git cherry-pick 0ab6054362ca8b702fa3bb3e86e79e5cd91b6b45

      - name: Make price drafts render-safe
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/cms/PricingManager.tsx')
          text = path.read_text()

          old_state = '''  const [selectedId, setSelectedId] = useState<number | null>(null);\n  const [regularPriceDraft, setRegularPriceDraft] = useState("");\n  const [salePriceDraft, setSalePriceDraft] = useState("");'''
          new_state = '''  const [selectedId, setSelectedId] = useState<number | null>(null);\n  const [priceDrafts, setPriceDrafts] = useState<\n    Record<number, { regularPrice: string; salePrice: string }>\n  >({});'''
          if old_state not in text:
              raise SystemExit('Price draft state block not found')
          text = text.replace(old_state, new_state, 1)

          old_effect = '''  const selected = dashboard?.products.find((product) => product.id === selectedId) ?? null;\n\n  useEffect(() => {\n    setRegularPriceDraft(selected?.regularPrice ?? "");\n    setSalePriceDraft(selected?.salePrice ?? "");\n  }, [selected?.id, selected?.regularPrice, selected?.salePrice]);\n'''
          new_effect = '''  const selected = dashboard?.products.find((product) => product.id === selectedId) ?? null;\n  const selectedPriceDraft = selected ? priceDrafts[selected.id] : undefined;\n  const regularPriceDraft =\n    selectedPriceDraft?.regularPrice ?? selected?.regularPrice ?? "";\n  const salePriceDraft =\n    selectedPriceDraft?.salePrice ?? selected?.salePrice ?? "";\n\n  function editPriceDraft(\n    patch: Partial<{ regularPrice: string; salePrice: string }>,\n  ) {\n    if (!selected) return;\n    setPriceDrafts((current) => ({\n      ...current,\n      [selected.id]: {\n        regularPrice:\n          current[selected.id]?.regularPrice ?? selected.regularPrice ?? "",\n        salePrice:\n          current[selected.id]?.salePrice ?? selected.salePrice ?? "",\n        ...patch,\n      },\n    }));\n  }\n'''
          if old_effect not in text:
              raise SystemExit('Synchronous price draft effect not found')
          text = text.replace(old_effect, new_effect, 1)

          text = text.replace(
              'setRegularPriceDraft(sanitizePriceInput(event.target.value))',
              'editPriceDraft({ regularPrice: sanitizePriceInput(event.target.value) })',
              1,
          )
          text = text.replace(
              'setSalePriceDraft(sanitizePriceInput(event.target.value))',
              'editPriceDraft({ salePrice: sanitizePriceInput(event.target.value) })',
              1,
          )

          path.write_text(text)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove temporary files
        run: rm -f .github/workflows/ship-independent-price-editor.yml price-editor-lint.txt

      - name: Commit and push tested port
        run: |
          git add -- app/api/cms/pricing/route.ts app/cms/PricingManager.tsx .github/workflows/ship-independent-price-editor.yml price-editor-lint.txt
          git commit -m "fix: ship independent CMS price editor"
          git push origin HEAD:fix/ship-independent-price-editor-20260813
