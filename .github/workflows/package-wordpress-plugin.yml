name: Package WordPress Plugin

on:
  push:
    branches:
      - main
    paths:
      - "wordpress/sepiid-product-bridge/**"
      - ".github/workflows/package-wordpress-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build installable plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: find wordpress/sepiid-product-bridge -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build WordPress plugin ZIP
        run: |
          cd wordpress
          zip -r ../sepiid-product-bridge-1.8.15.zip sepiid-product-bridge

      - name: Verify ZIP contents
        run: unzip -t sepiid-product-bridge-1.8.15.zip

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: sepiid-product-bridge-1.8.15
          path: sepiid-product-bridge-1.8.15.zip
          if-no-files-found: error
          retention-days: 14
