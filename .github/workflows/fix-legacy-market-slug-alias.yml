name: Fix legacy market slug aliases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-legacy-market-slug-alias.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize Woo duplicate slugs in legacy multi-source scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/market-pricing.ts')
          text = path.read_text(encoding='utf-8')

          marker = '''function expectedMarketIdentity(product: CmsProduct): string {\n  const catalogProduct = catalogProducts.find((item) => item.slug === product.slug);\n'''
          replacement = '''function catalogProductForPricing(product: CmsProduct) {\n  const exact = catalogProducts.find((item) => item.slug === product.slug);\n  if (exact) return exact;\n\n  // WooCommerce can reserve an older slug and append -2, -3, ... to the live product.\n  // Treat that suffix as a storage alias only when the base slug exists in our catalog.\n  const duplicate = product.slug.match(/^(.*)-(\\d+)$/u);\n  if (!duplicate) return undefined;\n  const suffix = Number(duplicate[2]);\n  if (!Number.isInteger(suffix) || suffix < 2 || suffix > 20) return undefined;\n  return catalogProducts.find((item) => item.slug === duplicate[1]);\n}\n\nfunction canonicalMarketProductSlug(product: CmsProduct): string {\n  return catalogProductForPricing(product)?.slug ?? product.slug;\n}\n\nfunction expectedMarketIdentity(product: CmsProduct): string {\n  const catalogProduct = catalogProductForPricing(product);\n'''
          if marker not in text:
              raise SystemExit('expectedMarketIdentity marker not found or already changed')
          text = text.replace(marker, replacement, 1)

          old = '''      if (!source.url && provider === "torob" && CURATED_TOROB_URLS[product.slug]) {\n        source.url = CURATED_TOROB_URLS[product.slug];\n        source.discovered = true;\n      }\n'''
          new = '''      const canonicalSlug = canonicalMarketProductSlug(product);\n      if (!source.url && provider === "torob" && CURATED_TOROB_URLS[canonicalSlug]) {\n        source.url = CURATED_TOROB_URLS[canonicalSlug];\n        source.discovered = true;\n      }\n'''
          if old not in text:
              raise SystemExit('curated Torob lookup marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/lib/market-pricing.ts
          rm .github/workflows/fix-legacy-market-slug-alias.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing.ts .github/workflows/fix-legacy-market-slug-alias.yml
          git commit -m "Pricing: canonicalize duplicate Woo slugs in all scanners"
          git push
