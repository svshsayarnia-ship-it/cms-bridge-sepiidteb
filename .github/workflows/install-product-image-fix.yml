name: Validate verified direct pricing sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-product-image-fix.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify direct product pages are live and priced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as htmlmod, json, re, urllib.request
          sources = {
            'ejal-40': ('https://tebsoo.co/product/%D9%85%D8%B2%D9%88%DA%98%D9%84-%D8%A7%D8%AC%D8%A7%D9%84/', ['ejal','اجال','ایجال']),
            'perleux': ('https://tebsoo.co/product/perleux/', ['perleux','پرلوکس']),
            'audrey-m': ('https://mesotop.com/product/%DA%98%D9%84-%D8%A7%D9%88%D8%AF%D8%B1%DB%8C-10-%D8%B3%DB%8C-%D8%B3%DB%8C-%D9%85%D8%AF%D9%84-%D8%A7%D9%85/', ['audrey','اودری']),
            'siax-100': ('https://capsoll.ir/product/%D8%A8%D9%88%D8%AA%D8%A7%DA%A9%D8%B3-%D8%B3%DB%8C%D8%A7%DA%A9%D8%B3/', ['siax','سیاکس']),
          }
          digits = str.maketrans('۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩','01234567890123456789')
          results={}
          for slug,(url,names) in sources.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read().decode('utf-8','ignore')
              status=r.status
            title_match=re.search(r'<h1\b[^>]*>([\s\S]{0,800}?)</h1>',body,re.I) or re.search(r'<title\b[^>]*>([\s\S]{0,800}?)</title>',body,re.I)
            title=htmlmod.unescape(re.sub(r'<[^>]+>',' ', title_match.group(1) if title_match else ''))
            title=re.sub(r'\s+',' ',title).strip()
            normalized=title.lower().replace('ي','ی').replace('ك','ک')
            identity=any(x in normalized for x in names)
            scope=body[body.lower().find('<h1'):][:50000] if '<h1' in body.lower() else body[:50000]
            text=htmlmod.unescape(re.sub(r'<[^>]+>',' ',scope)).translate(digits)
            prices=[]
            for m in re.finditer(r'([0-9][0-9.,٬،\s]{3,20})\s*(?:تومان|تومن)',text,re.I):
              raw=re.sub(r'[^0-9]','',m.group(1))
              if raw:
                value=int(raw)
                if 100000 <= value <= 1000000000: prices.append(value)
            if not prices:
              for m in re.finditer(r'"price"\s*:\s*"?([0-9۰-۹٠-٩.,٬،\s]{3,20})"?',body,re.I):
                raw=re.sub(r'[^0-9]','',m.group(1).translate(digits))
                if raw:
                  value=int(raw)
                  if 100000 <= value <= 1000000000:
                    if value > 20000000: value=round(value/10)
                    prices.append(value)
            ok=status==200 and identity and bool(prices)
            results[slug]={'ok':ok,'status':status,'title':title[:160],'minPriceToman':min(prices) if prices else None}
            print(slug,json.dumps(results[slug],ensure_ascii=False))
            if not ok: raise SystemExit(f'{slug}: direct source validation failed')
          print('SUMMARY',json.dumps(results,ensure_ascii=False))
          PY
      - name: Remove one-time validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-product-image-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/install-product-image-fix.yml
          git commit -m "chore: remove direct source validation" || exit 0
          git push
