name: Validate stable direct pricing pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-product-image-fix.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe stable direct pages concurrently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, html as htmlmod, json, re, time, urllib.request
          tests={
            'perleux':('https://mrdmed.com/product/%D9%85%D8%B2%D9%88%DA%98%D9%84-%D9%BE%D8%B1%D9%84%D9%88%DA%A9%D8%B3/',['پرلوکس','perleux']),
            'audrey-m':('https://capsoll.ir/product/%D9%81%DB%8C%D9%84%D8%B1-%D8%A7%D9%88%D8%AF%D8%B1%DB%8C-m/',['اودری','audrey']),
            'siax-100':('https://capsoll.ir/product/%D8%A8%D9%88%D8%AA%D8%A7%DA%A9%D8%B3-%D8%B3%DB%8C%D8%A7%DA%A9%D8%B3/',['سیاکس','siax']),
            'audrey-m-mesotop':('https://mesotop.com/product/%DA%98%D9%84-%D8%A7%D9%88%D8%AF%D8%B1%DB%8C-10-%D8%B3%DB%8C-%D8%B3%DB%8C-%D9%85%D8%AF%D9%84-%D8%A7%D9%85/',['اودری','audrey']),
          }
          digits=str.maketrans('۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩','01234567890123456789')
          def one(item):
            slug,(url,names)=item
            start=time.time()
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read().decode('utf-8','ignore'); status=r.status
              h=re.search(r'<h1\b[^>]*>([\s\S]{0,1000}?)</h1>',body,re.I) or re.search(r'<title\b[^>]*>([\s\S]{0,1000}?)</title>',body,re.I)
              title=htmlmod.unescape(re.sub(r'<[^>]+>',' ',h.group(1) if h else ''))
              title=re.sub(r'\s+',' ',title).strip()
              identity=any(x in title.lower().replace('ي','ی').replace('ك','ک') for x in names)
              idx=body.lower().find('<h1')
              scope=body[idx:idx+50000] if idx>=0 else body[:50000]
              text=htmlmod.unescape(re.sub(r'<[^>]+>',' ',scope)).translate(digits)
              prices=[]
              for m in re.finditer(r'([0-9][0-9.,٬،\s]{3,20})\s*(?:تومان|تومن)',text,re.I):
                raw=re.sub(r'[^0-9]','',m.group(1))
                if raw and 100000 <= int(raw) <= 100000000: prices.append(int(raw))
              return slug,{'ok':status==200 and identity and bool(prices),'status':status,'elapsed':round(time.time()-start,2),'title':title[:150],'minPriceToman':min(prices) if prices else None,'url':url}
            except Exception as e:
              return slug,{'ok':False,'elapsed':round(time.time()-start,2),'error':repr(e),'url':url}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            results=dict(ex.map(one,tests.items()))
          for k,v in results.items(): print(k,json.dumps(v,ensure_ascii=False))
          print('SUMMARY',json.dumps(results,ensure_ascii=False))
          if not results['perleux']['ok'] or not results['siax-100']['ok']:
            raise SystemExit('Required fallback source validation failed')
          if not (results['audrey-m']['ok'] or results['audrey-m-mesotop']['ok']):
            raise SystemExit('No stable Audrey M source')
          PY
      - name: Remove one-time validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-product-image-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/install-product-image-fix.yml
          git commit -m "chore: remove stable source validation" || exit 0
          git push
