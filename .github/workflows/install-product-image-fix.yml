name: Apply market pricing patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-product-image-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch comprehensive market scanner
        run: python3 scripts/patch_direct_market_fallbacks.py
      - name: Verify patch
        run: git diff --check
      - name: Commit and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-product-image-fix.yml
          rm -f .github/workflows/patch-direct-market-fallbacks.yml
          rm -f .github/workflows/run-direct-fallback-patch.yml
          rm -f scripts/patch_direct_market_fallbacks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing-comprehensive.ts .github/workflows/install-product-image-fix.yml .github/workflows/patch-direct-market-fallbacks.yml .github/workflows/run-direct-fallback-patch.yml scripts/patch_direct_market_fallbacks.py
          git commit -m "Pricing: add verified direct market fallbacks"
          git push
