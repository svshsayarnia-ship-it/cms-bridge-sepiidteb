name: Patch direct provider maps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-product-image-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete direct provider maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pricing = Path('app/lib/market-pricing.ts')
          s = pricing.read_text(encoding='utf-8')
          old = '  noavaransalamat: ["noavaransalamat.ir", "www.noavaransalamat.ir"],\n};'
          new = '  noavaransalamat: ["noavaransalamat.ir", "www.noavaransalamat.ir"],\n  direct: ["tebsoo.co", "www.tebsoo.co", "mesotop.com", "www.mesotop.com", "capsoll.ir", "www.capsoll.ir"],\n};'
          if '  direct: ["tebsoo.co"' not in s:
              if old not in s: raise SystemExit('PROVIDER_HOSTS anchor missing')
              s = s.replace(old, new, 1)
          pricing.write_text(s, encoding='utf-8')

          cms = Path('app/cms/PricingManager.tsx')
          s = cms.read_text(encoding='utf-8')
          old = '  noavaransalamat: "اگر لینک خالی باشد، تطبیق دقیق از نوآوران سلامت به‌صورت خودکار انجام می‌شود.",\n};'
          new = '  noavaransalamat: "اگر لینک خالی باشد، تطبیق دقیق از نوآوران سلامت به‌صورت خودکار انجام می‌شود.",\n  direct: "منبع مستقیمِ تأییدشده فقط برای محصولاتی استفاده می‌شود که صفحه دقیق همان مدل و حجم در فروشگاه معتبر موجود باشد.",\n};'
          if '  direct: "منبع مستقیمِ تأییدشده' not in s:
              if old not in s: raise SystemExit('PROVIDER_HELP anchor missing')
              s = s.replace(old, new, 1)
          cms.write_text(s, encoding='utf-8')
          PY
          git diff --check
          rm .github/workflows/install-product-image-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing.ts app/cms/PricingManager.tsx .github/workflows/install-product-image-fix.yml
          git commit -m "Pricing: complete direct provider integration"
          git push
