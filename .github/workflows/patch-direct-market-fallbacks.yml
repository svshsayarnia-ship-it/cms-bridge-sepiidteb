name: Patch verified direct market fallbacks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-direct-market-fallbacks.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct market fallback patch
        run: python3 scripts/patch_direct_market_fallbacks.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/patch-direct-market-fallbacks.yml
          rm scripts/patch_direct_market_fallbacks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing-comprehensive.ts .github/workflows/patch-direct-market-fallbacks.yml scripts/patch_direct_market_fallbacks.py
          git commit -m "Pricing: add verified direct market fallbacks"
          git push
