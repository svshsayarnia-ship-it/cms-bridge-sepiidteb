name: Code Quality

on:
  push:
    branches:
      - main
      - fix/cms-seo-architecture

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install product image audit dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Lint WordPress bridge PHP
        run: find wordpress/sepiid-product-bridge -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Audit normalized product cutouts
        run: npm run audit:product-images

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Package WordPress bridge
        id: package_bridge
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' wordpress/sepiid-product-bridge/sepiid-product-bridge.php | head -n1 | tr -d '\r')"
          if [ -z "$PLUGIN_VERSION" ]; then
            echo "Could not determine Sepiid Product Bridge version" >&2
            exit 1
          fi
          ARTIFACT_NAME="sepiid-product-bridge-${PLUGIN_VERSION}"
          rm -rf dist
          mkdir -p dist
          cp -R wordpress/sepiid-product-bridge dist/sepiid-product-bridge
          cd dist
          zip -qr "${ARTIFACT_NAME}.zip" sepiid-product-bridge
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/${ARTIFACT_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload WordPress bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_bridge.outputs.artifact_name }}
          path: ${{ steps.package_bridge.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14


  capture_live_portfolio:
    name: Capture live portfolio screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install screenshot tools
        run: |
          mkdir -p /tmp/site-capture
          cd /tmp/site-capture
          npm init -y
          npm install playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Capture live sites
        working-directory: /tmp/site-capture
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";

          const targets = [
            { name: "khottan", url: "https://www.khottan.ir/" },
            { name: "sepiid-beauty", url: "https://sepiidbeauty.ir/" },
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1600, height: 960 },
            deviceScaleFactor: 1,
            locale: "fa-IR",
            colorScheme: "light",
            reducedMotion: "reduce",
          });

          for (const target of targets) {
            const page = await context.newPage();
            page.setDefaultTimeout(30000);
            await page.goto(target.url, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(6000);
            await page.evaluate(() => {
              window.scrollTo(0, 0);
              const style = document.createElement("style");
              style.textContent = "*{animation:none!important;transition:none!important;caret-color:transparent!important}";
              document.head.appendChild(style);
            });
            await page.waitForTimeout(800);
            const raw = `${target.name}-raw.png`;
            const output = `${target.name}-800x480.png`;
            await page.screenshot({ path: raw, fullPage: false });
            await sharp(raw).resize(800, 480, { fit: "fill" }).png().toFile(output);
            console.log(`${target.name}: ${await page.title()} | ${page.url()}`);
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs

      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-site-screenshots-800x480
          path: |
            /tmp/site-capture/khottan-800x480.png
            /tmp/site-capture/sepiid-beauty-800x480.png
          if-no-files-found: error
          retention-days: 1
