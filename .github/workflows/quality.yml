name: Code Quality

on:
  push:
    branches:
      - main
      - fix/cms-seo-architecture

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint WordPress bridge PHP
        run: find wordpress/sepiid-product-bridge -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Package WordPress bridge
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R wordpress/sepiid-product-bridge dist/sepiid-product-bridge
          cd dist
          zip -qr sepiid-product-bridge-1.8.1.zip sepiid-product-bridge

      - name: Upload WordPress bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepiid-product-bridge-1.8.1
          path: dist/sepiid-product-bridge-1.8.1.zip
          if-no-files-found: error
          retention-days: 14
