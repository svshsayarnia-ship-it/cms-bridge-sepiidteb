name: Add verified market source fallbacks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-verified-market-source-fallbacks.yml"
      - "scripts/add-verified-market-source-fallbacks.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add independent market sources
        run: python3 scripts/add-verified-market-source-fallbacks.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing-comprehensive.ts
          git commit -m "Pricing: cross-check Torob with independent stores"
          git push
