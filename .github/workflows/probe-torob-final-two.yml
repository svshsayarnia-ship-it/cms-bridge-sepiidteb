name: Verify final Torob product sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-torob-final-two.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dysport sellers and Neuronox 50 search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          headers={"Accept":"application/json", "Referer":"https://torob.com/", "User-Agent":"Mozilla/5.0"}

          for key in ["c93d91a3-0679-44b6-8fa8-cfa4d77fd5bd", "014069b0-79f9-4801-9972-854fd92fd44f", "d5ff5173-19b3-495a-bbc6-e9da7be969d5"]:
              params=urllib.parse.urlencode({"prk":key,"page":0,"size":10})
              req=urllib.request.Request("https://api.torob.com/v4/base-product/sellers/?"+params,headers=headers)
              print("SELLERS",key)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: body=json.load(r)
                  for item in body.get("results",[])[:10]:
                      print(json.dumps({k:item.get(k) for k in ["price","shop_name","shop_name2","name","availability","is_available","stock_status"]},ensure_ascii=False))
              except Exception as e: print("ERROR",repr(e))

          queries=["بوتاکس نورونوکس", "نورونوکس بوتاکس", "Neuronox botox", "نورونوکس 50 واحد بوتاکس", "Neuronox 50 units"]
          for q in queries:
              params=urllib.parse.urlencode({"q":q,"page":0,"size":20,"source":"torob_search"})
              req=urllib.request.Request("https://api.torob.com/v4/base-product/search/?"+params,headers=headers)
              print("QUERY",q)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: body=json.load(r)
                  for item in body.get("results",[])[:10]:
                      print(json.dumps({k:item.get(k) for k in ["random_key","name1","name2","price","web_client_absolute_url"]},ensure_ascii=False))
              except Exception as e: print("ERROR",repr(e))
          PY
          rm .github/workflows/probe-torob-final-two.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/probe-torob-final-two.yml
          git commit -m "chore: remove final Torob probe"
          git push
