name: Fast validate uncovered market sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-uncovered-market-sources-fast.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concurrent fallback source validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, re, urllib.parse, urllib.request

          targets = {
            'ejal-40': ['ejal 40','ایجال 40'],
            'mesoheal-plus': ['mesoheal plus','مزوهیل پلاس'],
            'reyoungel-revital-bioha': ['reyoungel revital','ریانژل رویتال'],
            'roytrin-skin-booster': ['roytrin skin booster','رویترین اسکین بوستر'],
            'siax-100': ['siax 100','سیاکس 100'],
            'neuronox-100': ['neuronox 100','نورونوکس 100'],
            'cg-dimono-ptx': ['cg dimono ptx','دیمونو ptx'],
            'perleux': ['perleux','پرلوکس'],
            'audrey-m': ['audrey m','اودری ام'],
            'inovosense-family': ['inovosense','اینووسنس'],
            'neuronox-50': ['neuronox 50','نورونوکس 50'],
            'dysport': ['dysport','دیسپورت'],
          }
          providers = {
            'sayancenter':'https://sayancenter.com',
            'rokateb':'https://rokateb.ir',
            'noavaransalamat':'https://noavaransalamat.ir',
          }
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}

          def norm(s):
            s=(s or '').lower().replace('ي','ی').replace('ك','ک')
            s=re.sub(r'[^\w\u0600-\u06ff.]+',' ',s)
            return re.sub(r'\s+',' ',s).strip()
          def score(q,name):
            a=[x for x in norm(q).split() if len(x)>1]
            b=set(norm(name).split())
            return (sum(1 for x in a if x in b)/len(a)) if a and b else 0
          def task(args):
            slug,provider,base,q=args
            url=base+'/wp-json/wc/store/v1/products?'+urllib.parse.urlencode({'search':q,'per_page':20})
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=10) as r: rows=json.load(r)
            except Exception as e:
              return slug,[]
            hits=[]
            if isinstance(rows,list):
              for row in rows:
                name=row.get('name') or ''
                sc=score(q,name)
                prices=row.get('prices') or {}
                try:
                  p=float(prices.get('price') or 0)/(10**int(prices.get('currency_minor_unit') or 0))
                except: p=0
                if (prices.get('currency_code') or 'IRT').upper()=='IRR': p/=10
                if sc>=0.5 and row.get('is_in_stock') is not False and row.get('is_purchasable') is not False and p>=100000:
                  hits.append((sc,provider,name,round(p),row.get('permalink') or ''))
            return slug,hits

          jobs=[(slug,p,b,q) for slug,qs in targets.items() for p,b in providers.items() for q in qs]
          found={k:[] for k in targets}
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for slug,hits in ex.map(task,jobs): found[slug].extend(hits)
          matched=[]
          for slug,hits in found.items():
            uniq={ (x[1],x[2],x[3],x[4]):x for x in hits }
            best=sorted(uniq.values(),reverse=True,key=lambda x:x[0])[:5]
            if best:
              matched.append(slug)
              print('FOUND',slug,json.dumps(best,ensure_ascii=False))
            else:
              print('NONE',slug)
          print('SUMMARY',json.dumps({'targets':len(targets),'matched':len(matched),'matched_slugs':matched,'unmatched':[x for x in targets if x not in matched]},ensure_ascii=False))
          PY
          rm .github/workflows/validate-uncovered-market-sources-fast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-uncovered-market-sources-fast.yml
          git commit -m "chore: remove fast fallback validation"
          git push
