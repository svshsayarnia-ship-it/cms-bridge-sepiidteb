name: Prioritize curated Torob matches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-market-curated-priority.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prefer curated exact product before search discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/market-pricing-comprehensive.ts')
          text = path.read_text()
          old = '    const ranked = (await discoverTorobCandidate(product)) ?? curatedTorobCandidate(product);\n'
          new = '    const ranked = curatedTorobCandidate(product) ?? (await discoverTorobCandidate(product));\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('ranked candidate marker not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/patch-market-curated-priority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/market-pricing-comprehensive.ts .github/workflows/patch-market-curated-priority.yml
          git commit -m "Pricing: prefer curated exact Torob matches"
          git push
