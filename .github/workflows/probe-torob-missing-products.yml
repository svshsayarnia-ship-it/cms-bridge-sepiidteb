name: Probe Torob remaining products

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-torob-missing-products.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Torob API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = ["Neuronox 50", "نورونوکس 50", "Dysport", "دیسپورت"]
          for q in queries:
              params = urllib.parse.urlencode({"q": q, "page": 0, "size": 12, "source": "torob_search"})
              req = urllib.request.Request(
                  "https://api.torob.com/v4/base-product/search/?" + params,
                  headers={"Accept":"application/json", "Referer":"https://torob.com/", "User-Agent":"Mozilla/5.0"},
              )
              print("QUERY", q)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = json.load(r)
                  for item in body.get("results", [])[:8]:
                      print(json.dumps({k:item.get(k) for k in ["random_key","name1","name2","price","min_price","web_client_absolute_url","availability","stock_status"]}, ensure_ascii=False))
              except Exception as e:
                  print("ERROR", repr(e))
          PY
          rm .github/workflows/probe-torob-missing-products.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/probe-torob-missing-products.yml
          git commit -m "chore: remove temporary Torob probe"
          git push
