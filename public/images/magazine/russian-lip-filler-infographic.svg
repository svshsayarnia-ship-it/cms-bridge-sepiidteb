<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">راهنمای انتخاب فیلر لب روسی یا طبیعی</title>
  <desc id="desc">اینفوگرافیک مقایسه هدف، شکل ظاهری، معیار انتخاب و نکات ایمنی فیلر لب روسی و طبیعی</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf5ef"/>
      <stop offset="1" stop-color="#f1e3dc"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a3046"/>
      <stop offset="1" stop-color="#bd6d78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5f2335" flood-opacity=".12"/>
    </filter>
    <style>
      .fa { font-family: Vazirmatn, Vazir, Tahoma, Arial, sans-serif; fill: #321f25; }
      .light { fill: #fff; }
      .muted-light { fill: #ddc7c7; }
      .muted { fill: #745c61; }
      .small { font-size: 34px; }
      .body { font-size: 39px; }
      .label { font-size: 31px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 58px; font-weight: 800; }
      .card { fill: #fffdfb; stroke: #e8d6d1; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1600" height="1900" fill="url(#bg)"/>
  <circle cx="1420" cy="130" r="190" fill="#ead0d0" opacity=".45"/>
  <circle cx="120" cy="1760" r="240" fill="#ead0d0" opacity=".34"/>

  <g direction="rtl" text-anchor="middle">
    <text x="800" y="150" class="fa label" fill="#8a3046">SEPIID / EDITORIAL GUIDE</text>
    <text x="800" y="250" class="fa heading">فیلر لب روسی یا طبیعی؟</text>
    <text x="800" y="325" class="fa body muted">اول هدف را مشخص کن؛ بعد درباره مدل محصول و ناحیه تصمیم بگیر.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="410" width="650" height="510" rx="34" class="card"/>
    <rect x="850" y="410" width="650" height="510" rx="34" class="card"/>
  </g>

  <g direction="rtl" text-anchor="middle">
    <rect x="155" y="460" width="540" height="72" rx="36" fill="#8a3046"/>
    <text x="425" y="510" class="fa label light">مدل روسی</text>
    <rect x="905" y="460" width="540" height="72" rx="36" fill="#d9a7a9"/>
    <text x="1175" y="510" class="fa label">مدل طبیعی</text>

    <path d="M230 690 C310 610 365 610 425 674 C485 610 540 610 620 690 C550 748 486 776 425 776 C364 776 300 748 230 690Z" fill="#a4495d" opacity=".88"/>
    <path d="M980 690 C1060 650 1110 650 1175 682 C1240 650 1290 650 1370 690 C1305 730 1245 748 1175 748 C1105 748 1045 730 980 690Z" fill="#bf7780" opacity=".78"/>
    <text x="425" y="850" class="fa body">تأکید بیشتر بر ارتفاع و مرکز لب</text>
    <text x="1175" y="850" class="fa body">تأکید بر تناسب، حرکت و حجم کنترل‌شده</text>
  </g>

  <g>
    <rect x="100" y="1010" width="1400" height="600" rx="38" fill="#321f25"/>
    <text x="1380" y="1105" text-anchor="end" class="fa heading light">چهار فیلتر مهم پیش از انتخاب</text>
    <g>
      <circle cx="255" cy="1180" r="48" fill="#bd6d78"/><text x="255" y="1195" text-anchor="middle" class="fa heading light">۱</text>
      <text x="350" y="1173" text-anchor="start" class="fa body light">هدف و فرم پایه لب</text>
      <text x="350" y="1225" text-anchor="start" class="fa small muted-light">حجم، ارتفاع، تقارن یا ظاهر طبیعی؟</text>
    </g>
    <g>
      <circle cx="255" cy="1300" r="48" fill="#bd6d78"/><text x="255" y="1315" text-anchor="middle" class="fa heading light">۲</text>
      <text x="350" y="1293" text-anchor="start" class="fa body light">نام کامل محصول</text>
      <text x="350" y="1345" text-anchor="start" class="fa small muted-light">مدل، ترکیب، حجم و تعداد سرنگ را جدا بخوان.</text>
    </g>
    <g>
      <circle cx="255" cy="1420" r="48" fill="#bd6d78"/><text x="255" y="1435" text-anchor="middle" class="fa heading light">۳</text>
      <text x="350" y="1413" text-anchor="start" class="fa body light">اصالت و مسیر تأمین</text>
      <text x="350" y="1465" text-anchor="start" class="fa small muted-light">ظاهر جعبه به‌تنهایی مدرک کافی نیست.</text>
    </g>
    <g>
      <circle cx="255" cy="1540" r="48" fill="#bd6d78"/><text x="255" y="1555" text-anchor="middle" class="fa heading light">۴</text>
      <text x="350" y="1533" text-anchor="start" class="fa body light">فرد واجد صلاحیت و برنامه پیگیری</text>
      <text x="350" y="1585" text-anchor="start" class="fa small muted-light">انتخاب محصول بدون برنامه ایمنی کامل نیست.</text>
    </g>
  </g>

  <g direction="rtl" text-anchor="middle">
    <rect x="100" y="1640" width="1400" height="150" rx="28" fill="#fffdfb" stroke="#e1c4c1" stroke-width="3"/>
    <text x="800" y="1705" class="fa body" font-weight="700">هیچ فیلری برای همه «بهترین» نیست.</text>
    <text x="800" y="1760" class="fa small muted">فیلر، تکنیک و نتیجه را با هم یکی ندانیم؛ تصمیم ایمن از ارزیابی شروع می‌شود.</text>
    <text x="800" y="1845" class="fa small muted">sepiidbeauty.ir/magazine/russian-lip-filler-guide</text>
  </g>
</svg>
